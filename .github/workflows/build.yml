# Builds OpenImp and its installer on every push and pull request.
# Run it manually with a version (Actions > Build > Run workflow) or push a
# tag like v1.0.0 to publish a GitHub release with OpenImpSetup-<version>.exe.

name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0 (creates tag v<version>)'
        required: true

# Read-only by default; only the release job below can write to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Inputs reach the script through environment variables, never pasted
      # into its text, and the version must look like one.
      - name: Pick version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version -and $env:REF_TYPE -eq 'tag') { $version = $env:REF_NAME.TrimStart('v') }
          if (-not $version) { $version = '0.0.0-dev' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Not a version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$([bool]($env:INPUT_VERSION -or $env:REF_TYPE -eq 'tag'))".ToLower() >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build binaries and installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-installer.ps1 -Version $env:VERSION

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenImpSetup-${{ steps.version.outputs.version }}
          path: build/installer/OpenImpSetup-*.exe

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenImpSetup-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        # Third-party action with write access: pinned to a commit (v2 as of this change).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: OpenImp ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/OpenImpSetup-${{ needs.build.outputs.version }}.exe
          body: |
            Badge sign-in for Windows with Imprivata/RFIDeas readers.

            Run `OpenImpSetup-${{ needs.build.outputs.version }}.exe`, then open **OpenImp Badge Sign-in** from the Start menu to enroll a badge.
            Silent install: `OpenImpSetup-${{ needs.build.outputs.version }}.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART`

            The installer isn't code-signed yet, so Windows SmartScreen may warn.
